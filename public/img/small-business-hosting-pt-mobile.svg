<text x="24" y="327" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14.5" font-weight="600" fill="#eef1f8">App sob medida</text>
<text x="24" y="347" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#9aa3b8">ferramenta própria, controle</text>
<text x="24" y="367" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#f5a524">→ VPS</text>
